name: 'Check for broken links'
on:
  pull_request:
    branches:
      - main
jobs:
  check-links:
    name: 'Check for broken links'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - env:
          BRANCH_NAME_OR_REF: ${{ github.head_ref || github.ref }}
        run: echo "name=BRANCH_NAME::${BRANCH_NAME_OR_REF#refs/heads/}" >> $GITHUB_ENV
      - run: echo "name=PR_NUMBER::$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV
      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: die-koma.org-check-links-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: die-koma.org-check-links-${{ runner.os }}-
          gc-max-store-size-linux: 2.5G
          purge: true
          purge-prefixes: die-koma.org-check-links-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never
      - env:
          BRANCH_NAME_OR_REF: ${{ github.head_ref || github.ref }}
        run: echo "name=BRANCH_NAME::${BRANCH_NAME_OR_REF#refs/heads/}" >> $GITHUB_ENV
      - run: echo "name=PR_NUMBER::$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")" >> $GITHUB_ENV
      - run: nix --print-build-logs run .#check-links
      - name: Build and collect garbage
        run: |
          nix build .\#KoMaHomepage
          nix-store --gc --option keep-derivations true --option keep-outputs true
